name: Print Secret CTF

on: [push]

jobs:
  capture-the-flag:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt to reveal the secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Attempt 1: Direct echo"
          echo ${{ secrets.API_KEY }}

          echo "Attempt 2: Echo from an environment variable"
          echo $API_KEY