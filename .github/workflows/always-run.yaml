# A basic workflow to print repository details
name: Print Project Details

# Controls when the action will run. 
# This example runs on every push to any branch.
on: [push]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "print"
  print:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # A single step that uses the echo command to print context information
    - name: Print repository, branch, and commit hash
      run: |
        echo "Project Repository: ${{ github.repository }}"
        echo "Branch Name: ${{ github.ref_name }}"
        echo "Commit Hash: ${{ github.sha }}"