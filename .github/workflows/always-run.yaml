# A basic workflow to print repository details
name: Print Project Details

# Controls when the action will run.
# This workflow now runs on pushes AND pull requests
# One option for better security: use pull_target_request so the CI/CD code is the code on main instead of a bad actor branch.
on: [push, pull_request_target]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "print"
  print:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # A single step that uses the echo command to print context information
    - name: Print repository, branch, and commit hash
      run: |
        echo "Project Repository: ${{ github.repository }}"
        echo "Branch Name: ${{ github.ref_name }}"
        echo "Commit Hash: ${{ github.sha }}"

    # NOTE: this is INSECURE, I just want to see how bad it can be
    # This new step ONLY runs when the trigger is a pull request, but do it with the code from the target branch.
    # This is only a defense IF you have branch protection rules and this code never gets merged into the trunk. Still pretty insecure...
    - name: Print PR Title Using Target Branch Code
      if: github.event_name == 'pull_request_target'
      run: |
        echo "PR Title: ${{ github.event.pull_request.title }}"

    # NOTE: this is INSECURE, I just want to see how bad it can be
    # This new step ONLY runs when the trigger is a pull request
    - name: Print PR Title
      if: github.event_name == 'pull_request'
      run: |
        echo "PR Title: ${{ github.event.pull_request.title }}"

    # This is supposed to be a safer version that escapes the PR title according to Gemini
    - name: Print Escaped PR Title
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        echo "Thanks for the PR, $PR_TITLE!"
        # You can now safely use the variable in scripts
        # Always quote variables in shell scripts for extra safety
        #./my-script.sh "$PR_TITLE"