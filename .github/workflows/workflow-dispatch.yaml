name: Exfiltrate The Secret

# This workflow is triggered manually
# We will recieve a message and print it. Since we have severed the link between the string being a secret, the repo action runners should just print it with no censoring.
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Enter a message to print'
        required: true
        default: 'Hello world'
        type: string

jobs:
  exfiltrate-the-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Print the dispatch message securely
        env:
          USER_MESSAGE: ${{ github.event.inputs.message }}
        run: |
          echo "This is the safe way to print the message:"
          echo "$USER_MESSAGE"